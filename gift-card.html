
<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>¡Aquí tienes tu tarjeta regalo de Zenqa Life!</title>
    <link rel="stylesheet" href="assets/base.css">
<style>
  :root {
    --color-bg: #F7F5EC; --color-surface: #FFFFFF; --color-sage: #D8E6D0;
    --color-matcha: #CBECB8; --color-forest: #14452F; --color-ink: #0B0B0B;
    --color-pink: #FF6EBC; --color-muted: #5A6B5F;
    --color-line: rgba(20,69,47,.16); --color-line-strong: rgba(20,69,47,.28);
    --shadow-sm: 0 1px 2px rgba(11,11,11,.04), 0 4px 12px rgba(11,11,11,.04);
    --shadow-md: 0 8px 30px rgba(11,11,11,.08); --shadow-lg: 0 20px 60px rgba(11,11,11,.14);
    --shadow-green: 0 18px 40px rgba(20,69,47,.18);
    --font-display: 'Bebas Neue', Impact, Haettenschweiler, sans-serif;
    --font-body: 'Mulish', system-ui, -apple-system, sans-serif;
    --font-editorial: 'Cormorant Garamond', Georgia, serif;
    --radius: 14px; --radius-sm: calc(var(--radius) * .5); --radius-lg: calc(var(--radius) * 1.8);
    --font-size-base: 16px;
    --step--2: clamp(.69rem,.68rem + .06vw,.72rem); --step--1: clamp(.79rem,.77rem + .1vw,.84rem);
    --step-0: clamp(.94rem,.91rem + .15vw,1rem); --step-1: clamp(1.09rem,1.04rem + .25vw,1.25rem);
    --step-2: clamp(1.28rem,1.18rem + .5vw,1.56rem); --step-3: clamp(1.5rem,1.32rem + .9vw,1.95rem);
    --step-4: clamp(1.76rem,1.46rem + 1.5vw,2.44rem); --step-5: clamp(2.06rem,1.58rem + 2.4vw,3.05rem);
    --step-6: clamp(2.42rem,1.66rem + 3.8vw,3.81rem); --step-7: clamp(2.84rem,1.68rem + 5.8vw,4.77rem);
    --step-8: clamp(3.33rem,1.6rem + 8.7vw,5.96rem);
    --space-3xs:4px; --space-2xs:8px; --space-xs:12px; --space-sm:16px; --space-md:24px; --space-lg:32px;
    --space-xl:48px; --space-2xl:64px; --space-3xl:96px; --space-4xl:128px;
    --ease-out: cubic-bezier(.22,1,.36,1); --dur: 320ms;
    --display-scale: 1.1; --gutter: 20px; --header-height: 64px;
    --z-header: 60; --z-drawer: 90; --z-modal: 100; --z-toast: 120;
  }
  body { margin: 0; }
  .preview-mock { opacity: .98; }
</style></head>
  <body class="template-gift-card">
    <main class="section">
      <div class="container container--narrow gift-card-page">
        <div style="text-align:center"><img src="assets/logo-white.png" alt="Zenqa Life" width="170" height="57" style="max-width:170px;margin-inline:auto"><h1 class="h3" style="margin-top:var(--space-md)">¡Aquí tienes tu tarjeta regalo de Zenqa Life!</h1>
          <p class="lead">Tu tarjeta regalo</p>
        </div>

        <div class="gift-card">
          <div class="gift-card__balance">
            <span>Saldo</span>
            <strong>50,00 €</strong>
          </div><span class="text-muted">15/09/2028</span><div class="gift-card__code" id="GiftCardCode">2208  DDA 4 5E 33 9 F21</div>
          <div class="flex" style="gap:var(--space-sm);align-items:center;justify-content:space-between;flex-wrap:wrap">
            <img src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27%3E%3Crect width=%2710%27 height=%2710%27 fill=%27%23fff%27/%3E%3Cpath d=%27M0 0h4v4H0zM6 0h4v4H6zM0 6h4v4H0zM6 6h1v1H6zM8 8h2v2H8z%27 fill=%27%23000%27/%3E%3C/svg%3E" alt="Código QR" width="120" height="120" style="image-rendering:pixelated">
            <div class="stack">
              <p class="text-muted" style="font-size:var(--step--1)">Usa este código al finalizar la compra</p>
              <div class="btn-group">
                <button class="btn btn--sm" type="button" onclick="window.print()">Imprimir</button>
                <button class="btn btn--ghost btn--sm" type="button" id="CopyCode">Copiar enlace</button>
                <a class="btn btn--ghost btn--sm" href="https://zenqalife.roadshop.online">Volver al inicio</a>
              </div>
            </div>
          </div>
        </div>
        <p class="text-muted" style="text-align:center;font-size:var(--step--1)">¿Tienes una tarjeta regalo?: Introduce tu código para canjearla</p>
      </div>
    </main>
    <script>
      var copyBtn = document.getElementById('CopyCode');
      if (copyBtn) copyBtn.addEventListener('click', function () {
        var code = document.getElementById('GiftCardCode').textContent.trim();
        if (navigator.clipboard) navigator.clipboard.writeText(code);
        copyBtn.textContent = '¡Copiado!';
      });
    </script>
  </body>
</html>
